<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Vinicius Gitti Venditti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cor-fundo: #0a0a0a;
            --cor-panel: #141414;
            --cor-borda: #2a2a2a;
            --cor-texto: #e8e8e8;
            --cor-texto-secundario: #949494;
            --cor-destaque: #ff1a1a;
            --cor-destaque-escuro: #b30000;
            --cor-neon: #ff0033;
            --cor-acento: #8b0000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Texturas decorativas de fundo (estilo tatuagem) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 0, 51, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(139, 0, 0, 0.06) 0%, transparent 40%),
                repeating-linear-gradient(0deg, transparent 0 2px, var(--cor-borda) 2px 4px);
            background-size: 400px 400px, 500px 500px, 100% 4px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 80px 20px 40px;
            position: relative;
        }

        header h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            text-transform: uppercase;
            letter-spacing: 8px;
            color: var(--cor-texto);
            text-shadow: 0 0 20px rgba(255, 0, 51, 0.4), 0 4px 8px rgba(0,0,0,0.8);
            margin-bottom: 12px;
            display: inline-block;
            border-bottom: 3px solid var(--cor-destaque);
            padding-bottom: 8px;
        }

        header p {
            font-size: 1.1rem;
            color: var(--cor-texto-secundario);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }

        /* Linha divisória */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--cor-borda), transparent);
            margin: 40px 0;
        }

        /* Seção de upload */
        .upload-section {
            background: var(--cor-panel);
            border: 2px solid var(--cor-borda);
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            transition: border-color 0.3s;
        }

        .upload-section:hover {
            border-color: var(--cor-destaque);
        }

        .upload-section h3 {
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--cor-destaque);
            margin-bottom: 8px;
        }

        .upload-section p {
            color: var(--cor-texto-secundario);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .upload-btn {
            display: inline-block;
            background: var(--cor-destaque);
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 0 var(--cor-destaque-escuro);
        }

        .upload-btn:hover {
            background: var(--cor-destaque-escuro);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--cor-destaque-escuro);
        }

        .upload-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 0 var(--cor-destaque-escuro);
        }

        input[type="file"] {
            display: none;
        }

        #uploadStatus {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--cor-texto-secundario);
        }

        /* Galeria */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .tattoo-item {
            background: var(--cor-panel);
            border: 1px solid var(--cor-borda);
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .tattoo-item:hover {
            border-color: var(--cor-destaque);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(255, 0, 51, 0.15);
        }

        .tattoo-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }

        .tattoo-info {
            padding: 18px;
        }

        .tattoo-info h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: var(--cor-texto);
        }

        .tattoo-info p {
            font-size: 0.85rem;
            color: var(--cor-texto-secundario);
            margin-bottom: 8px;
        }

        .tattoo-info small {
            font-size: 0.75rem;
            color: var(--cor-texto-secundario);
            font-family: monospace;
        }

        /* Badge de estilo */
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--cor-destaque);
            color: white;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Vazias */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--cor-texto-secundario);
        }

        /* Rodapé */
        footer {
            border-top: 1px solid var(--cor-borda);
            padding: 40px 0;
            text-align: center;
            color: var(--cor-texto-secundario);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }

            .tattoo-image {
                height: 260px;
            }

            header {
                padding: 50px 20px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vinicius Gitti Venditti</h1>
            <p>Estúdio de Tatuagem &middot; Arte Corporal</p>
        </header>

        <div class="divider"></div>

        <div class="upload-section">
            <h3>Gerenciar Tatuagens</h3>
            <p>Faça upload ou atualize tatuagens através do GitHub</p>
            <label class="upload-btn">
                Escolher Imagens
                <input type="file" id="imageUpload" multiple accept="image/*">
            </label>
            <p id="uploadStatus"></p>
        </div>

        <div id="tattooGallery" class="gallery">
            <!-- As tatuagens serão carregadas aqui -->
        </div>

        <footer>
            &copy; [Nome do Tatuador] Estúdio de Tatuagem. Todos os direitos reservados.
        </footer>
    </div>

    <script>
        // Sistema de carregamento de imagens baseado no GitHub
        let imagens = [];

        // Carrega as imagens do GitHub
        async function carregarImagens() {
            try {
                const response = await fetch('https://api.github.com/repos/seu-usuario/seu-repositorio/contents/img');
                const files = await response.json();

                imagens = files.filter(file => file.name.match(/\.(jpg|jpeg|png|gif)$/i));
                renderizarGaleria();
            } catch (error) {
                console.error('Erro ao carregar imagens:', error);
                // Mensagem de fallback para demonstração
                imagens = [
                    { download_url: 'https://via.placeholder.com/400x500/0a0a0a/ff0033?text=Tatuagem+1', name: 'tatuagem-1.jpg' },
                    { download_url: 'https://via.placeholder.com/400x500/0a0a0a/ff0033?text=Tatuagem+2', name: 'tatuagem-2.jpg' },
                    { download_url: 'https://via.placeholder.com/400x500/0a0a0a/ff0033?text=Tatuagem+3', name: 'tatuagem-3.jpg' }
                ];
                renderizarGaleria();
            }
        }

        function renderizarGaleria() {
            const gallery = document.getElementById('tattooGallery');
            gallery.innerHTML = '';

            if (imagens.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <p>Nenhuma tatuagem cadastrada ainda.</p>
                        <p>Use o botão acima para adicionar suas obras.</p>
                    </div>
                `;
                return;
            }

            const estilos = ['Tradicional', 'Realismo', 'Neo Tradicional', 'Fineline', 'Geométrico', 'Japonesa'];

            imagens.forEach((imagem, index) => {
                const item = document.createElement('div');
                item.className = 'tattoo-item';
                const estilo = estilos[index % estilos.length];
                item.innerHTML = `
                    <span class="badge">${estilo}</span>
                    <img src="${imagem.download_url}" alt="Tatuagem ${index + 1}" class="tattoo-image" loading="lazy">
                    <div class="tattoo-info">
                        <h3>Tatuagem ${index + 1}</h3>
                        <p>Estilo: ${estilo}</p>
                        <small>Arquivo: ${imagem.name}</small>
                    </div>
                `;
                gallery.appendChild(item);
            });
        }

        // Upload de imagens via GitHub
        document.getElementById('imageUpload').addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length === 0) return;

            const status = document.getElementById('uploadStatus');
            status.textContent = 'Fazendo upload das imagens...';
            status.style.color = '#ff0033';

            for (let file of files) {
                await fazerUploadParaGitHub(file);
            }

            status.textContent = 'Imagens enviadas com sucesso! Atualize a página para ver.';
            status.style.color = '#4ade80';
        });

        async function fazerUploadParaGitHub(arquivo) {
            // Esta é uma demonstração - na prática, você usaria GitHub API tokens
            console.log('Fazendo upload:', arquivo.name);
            alert(`Para fazer upload real de imagens, você precisará:\n1. Criar um token pessoal no GitHub\n2. Fazer upload das imagens manualmente para a pasta 'img/' no seu repositório\n3. Ou usar um serviço como Firebase Storage para uploads reais`);
        }

        // Carregar imagens quando a página carrega
        carregarImagens();
    </script>
</body>
</html>
